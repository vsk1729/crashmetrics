site_name: crashmetrics
site_description: Open-source Python for automotive crash safety calculations
site_url: https://vsk1729.github.io/crashmetrics/
repo_url: https://github.com/vsk1729/crashmetrics
repo_name: vsk1729/crashmetrics
edit_uri: edit/main/docs/
copyright: MIT licence · crashmetrics contributors · not affiliated with Euro NCAP, Bharat NCAP, UNECE or Ansys

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 2

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first calculation: getting-started/first-calculation.md
      - Loading your data: getting-started/loading-data.md
      - Units, signs and filters: getting-started/conventions.md
  - Guides:
      - guides/index.md
      - Signals, HIC and the 3 ms clip: guides/signals.md
      - Pedestrian headform (Euro NCAP): guides/pedestrian-headform.md
      - Pedestrian legforms and VRU score: guides/pedestrian-legforms.md
      - Flex-PLI and AIS-100 compliance: guides/flexpli-ais100.md
      - Frontal dummy criteria: guides/frontal-dummy-criteria.md
      - Euro NCAP MPDB and full width: guides/euroncap-frontal.md
      - Euro NCAP side and far side: guides/euroncap-side.md
      - Bharat NCAP star rating: guides/bharat-ncap.md
      - Homologation (R94, R95, R135, EV safety): guides/homologation.md
      - Vehicle pulse and crush energy: guides/pulse-energy.md
      - Intrusion measurement: guides/intrusion.md
      - LS-DYNA energy checks: guides/lsdyna-energy.md
      - Batch runs, analytics and ML: guides/batch-analytics.md
      - Features for machine learning: guides/ml-features.md
      - Test-versus-CAE correlation: guides/test-cae-correlation.md
  - Protocol notes: protocol-notes.md
  - API reference:
      - reference/index.md
      - signals: reference/signals.md
      - acceleration: reference/acceleration.md
      - pedestrian: reference/pedestrian.md
      - head: reference/head.md
      - neck: reference/neck.md
      - thorax: reference/thorax.md
      - pelvis: reference/pelvis.md
      - lower_extremity: reference/lower_extremity.md
      - side: reference/side.md
      - frontal_scoring: reference/frontal_scoring.md
      - side_scoring: reference/side_scoring.md
      - bncap: reference/bncap.md
      - pulse: reference/pulse.md
      - energy: reference/energy.md
      - energy_check and lsdyna: reference/lsdyna.md
      - features: reference/features.md
      - correlation: reference/correlation.md
      - intrusion: reference/intrusion.md
      - homologation: reference/homologation.md
  - About:
      - Changelog: about/changelog.md
      - Development and releases: about/development.md
      - Disclaimer and trademarks: about/disclaimer.md

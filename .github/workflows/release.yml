name: Release

# Publishes with PyPI Trusted Publishing (no API tokens stored here).
#
# - Run this workflow manually ("Run workflow" on the Actions tab) to
#   publish the current version to TestPyPI.
# - Publish a GitHub release with a tag like v0.3.0 to publish that
#   version to PyPI. The tag must match crashmetrics.__version__.
#
# Before either upload, the built wheel is installed on Python 3.10-3.13
# and the full test suite runs against it.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/crashmetrics/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "Package version: $version, release tag: $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import crashmetrics, crashmetrics.pulse, crashmetrics.lower_extremity; print(crashmetrics.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  test-wheel:
    name: Test the wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source (tests, examples and test data only)
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Install the built wheel
        run: |
          rm -rf src     # the tests must use the installed wheel, not the source
          python -m pip install dist/*.whl "pytest>=8"

      - name: Check the installed package
        run: |
          python -c "import crashmetrics, sys; print(crashmetrics.__version__, crashmetrics.__file__); assert 'site-packages' in crashmetrics.__file__"
          crashmetrics-ascii --help

      - name: Run the test suite against the wheel
        run: python -m pytest -q

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/crashmetrics/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crashmetrics/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.numpy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["latest NumPy"]
        include:
          # Oldest NumPy allowed by pyproject.toml, on a Python it supports.
          - python-version: "3.10"
            numpy: "NumPy 1.24"
            numpy-pin: "numpy==1.24.*"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]" ${{ matrix.numpy-pin }}

      - name: Run tests
        run: python -m pytest -v

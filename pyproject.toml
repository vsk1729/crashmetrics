[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crashmetrics"
dynamic = ["version"]
description = "Python tools for automotive crash engineering metrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Voonna Satish Kumar" }]
dependencies = [
    "numpy>=1.24"
]
keywords = [
    "crashworthiness",
    "LS-DYNA",
    "CAE",
    "HIC",
    "automotive-safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build",
    "twine",
    "mypy",
    "ruff"
]

[project.scripts]
crashmetrics-energy = "crashmetrics.lsdyna:main"

[project.urls]
Homepage = "https://github.com/vsk1729/crashmetrics"
Source = "https://github.com/vsk1729/crashmetrics"
Issues = "https://github.com/vsk1729/crashmetrics/issues"
Changelog = "https://github.com/vsk1729/crashmetrics/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.setuptools.dynamic]
version = { attr = "crashmetrics.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crashmetrics = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]